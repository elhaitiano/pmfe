name: PMFE consolidated checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    env:
      PMF_DATA_DIR: ${{ github.workspace }}/.runtime/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt
      - run: python app/manage.py check
      - run: python app/manage.py makemigrations --check --dry-run
      - run: python app/manage.py collectstatic --noinput
      - run: python app/manage.py test training.test_recovery_import training.test_home_card_values training.test_direct_assessments training.test_release_lineage training.test_unified_kpis training.test_practical_catalogue training.test_planning training.test_scheduling_f6 training.test_attendance_management training.test_dashboard training.test_indicators training.test_certificate_register
