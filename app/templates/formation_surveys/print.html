{% extends 'base.html' %}{% load static %}{% block heading %}Imprimir ficha de avaliação{% endblock %}
{% block extra_styles %}<link rel="stylesheet" href="{% static 'pmf/formation-surveys.css' %}">{% endblock %}{% block content %}<section class="content p-10 space-y-6 fs-layout"><section class="gf-panel"><form method="get" class="gf-body">{{ form.non_field_errors }}<div class="gf-form-grid">{% for field in form %}<label for="{{ field.id_for_label }}"><span class="gf-label">{{ field.label }}</span>{{ field }}{{ field.errors }}</label>{% endfor %}</div><div class="flex flex-wrap gap-3 mt-4"><button class="gf-btn" name="download" value="1">Gerar PDF</button><button class="gf-btn alt" name="choose" value="1">Actualizar participantes do grupo</button><a class="gf-btn alt" href="{% url 'formation_survey_index' %}">Voltar</a></div></form></section></section>{% endblock %}
