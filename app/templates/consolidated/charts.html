{% if formation_chart %}<div class="panel"><h2>Formandos distintos por formação</h2><p>Uma pessoa é contada uma vez em cada formação, mesmo com várias edições ou documentos.</p>{% for bar in formation_chart %}<div style="margin:13px 0"><small>{{ bar.title|truncatechars:90 }} · {{ bar.count }}</small><div style="height:11px;background:#11283c;border-radius:8px;margin-top:5px"><div style="height:11px;background:linear-gradient(90deg,#168bd2,#2edebc);border-radius:8px;width:{{ bar.width|stringformat:'f'|unlocalize }}%"></div></div></div>{% endfor %}</div>{% endif %}
