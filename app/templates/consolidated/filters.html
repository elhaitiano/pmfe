<form class="panel filters no-print" method="get"><label>Nome, mecanográfico ou formação<input name="q" value="{{ filters.q|unlocalize }}"></label><label>Formação<select name="course"><option value="">Todas</option>{% for course in courses %}<option value="{{ course.course_reference|unlocalize }}" {% if filters.course == course.course_reference %}selected{% endif %}>{{ course.title }}</option>{% endfor %}</select></label><label>Grupo / edição<select name="group"><option value="">Todos</option>{% for e in editions %}<option value="{{ e.pk|unlocalize }}" {% if filters.group == e.pk|stringformat:'s' %}selected{% endif %}>{{ e.course_reference }} · {% if e.group_label %}G{{ e.group_label }}{% else %}Sem grupo indicado{% endif %} · {{ e.start|date:'d/m/Y' }}</option>{% endfor %}</select></label><label>Ano<select name="year"><option value="">Todos</option>{% for y in years %}<option value="{{ y.year|unlocalize }}" {% if filters.year == y.year|stringformat:'s' %}selected{% endif %}>{{ y.year|unlocalize }}</option>{% endfor %}</select></label><label>Desde<input name="start" type="date" value="{{ filters.start|unlocalize }}"></label><label>Até<input name="end" type="date" value="{{ filters.end|unlocalize }}"></label><button class="button">Aplicar filtros</button></form>
