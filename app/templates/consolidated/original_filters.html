<form method="get" class="exec-filters no-print"><div class="exec-filter"><label for="history-search">Formando ou formação</label><input id="history-search" class="gf-field" name="q" value="{{ filters.q|unlocalize }}"></div><div class="exec-filter"><label for="history-direction">Direção</label><select id="history-direction" name="direction" class="gf-field"><option value="">Todas</option>{% for name in directions %}<option {% if filters.direction == name %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div><div class="exec-filter"><label for="history-year">Ano</label><select name="year" id="history-year" class="gf-field"><option value="">Todos</option>{% for date in years %}<option value="{{ date.year|unlocalize }}" {% if filters.year == date.year|stringformat:'s' %}selected{% endif %}>{{ date.year|unlocalize }}</option>{% endfor %}</select></div><button class="exec-button primary">Aplicar filtros</button><a class="exec-reset" href="{{ request.path|unlocalize }}">Limpar</a><a class="exec-button" href="{% url 'consolidated_reconciliation' %}">Conferência dos dados</a></form>
