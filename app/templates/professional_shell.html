<dialog id="pmfe-workspace" aria-labelledby="pmfe-panel-title"><header class="pmfe-panel-header"><button type="button" id="pmfe-panel-back" aria-label="Voltar ao painel anterior" hidden>←</button><h2 id="pmfe-panel-title">Detalhes</h2><button type="button" id="pmfe-panel-refresh" aria-label="Actualizar página de origem">↻</button><a id="pmfe-panel-full" href="#">Abrir página completa</a><button type="button" id="pmfe-panel-close" aria-label="Fechar painel">✕</button></header><div id="pmfe-frames"></div></dialog>
{% if user.is_staff %}<dialog id="pmfe-notifications" aria-labelledby="pmfe-notifications-title"><header class="pmfe-panel-header"><h2 id="pmfe-notifications-title">Notificações pendentes</h2><button type="button" id="pmfe-notifications-refresh" aria-label="Actualizar notificações">↻</button><button type="button" id="pmfe-notifications-close" aria-label="Fechar notificações">✕</button></header><div id="pmfe-notifications-list" aria-live="polite">A consultar pendências…</div></dialog>{% endif %}
<div id="pmfe-ui-status" class="pmfe-sr-only" role="status" aria-live="polite"></div>
