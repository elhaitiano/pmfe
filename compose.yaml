name: pmf-containers

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    environment:
      PMF_DATA_DIR: /data
    volumes:
      - database:/data
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/entrar/', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "127.0.0.1:${PMF_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

# SQLite is a file, not a network database service.
# This volume persists the database, secret key, archived PDFs and startup backups.
volumes:
  database:
